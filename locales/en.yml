newapi:
  invalidSite: This site did not return compatible New API status and usage data. Check the URL and try again.
  invalidKey: Enter a valid relay key for this New API instance.
  insufficientScope: This relay key could not read its usage. Check the key and any IP restrictions.
  temporary: New API could not be validated right now. Your existing data and key are unchanged.
  permissionDeclined: New API access was not changed. Allow access when you are ready to try again.
  connectTitle: Connect New API
  replaceTitle: Replace New API connection
  subtitle: Independent instance · Independent relay key
  subtitleNamed: "{label} · Independent instance · Independent relay key"
  capabilities: Key-specific quota · Capped or unlimited
  explanation: Each New API connection keeps its own relay key, label, usage, and history. It shows key-specific granted, used, and remaining quota. Unlimited keys show absolute usage without an invented percentage. Same-origin connections share only Chrome's host permission.
  formName: New API relay key setup
  labelField: Instance label (optional)
  labelPlaceholder: Personal relay
  labelHelp: Used to distinguish this connection. If blank, AI Limits uses the reported account name or relay hostname.
  urlField: New API site URL
  urlPlaceholder: https://new-api.example.com
  urlHelp: Paste the homepage, dashboard URL, or an API URL such as /v1/messages. AI Limits removes known console and API suffixes, then validates the instance through /api/status. HTTPS is required, except localhost for development.
  keyField: New API relay key
  keyHelp: AI Limits calls only the read-only /api/usage/token/ endpoint and stores the key locally. The request is read-only, but the relay key itself may still call models; apply key limits in New API if needed.
  excluded: This mode does not read account wallet, subscriptions, admin data, or other relay keys. Each configured instance is read independently.

