providers:
  chatgpt:
    name: ChatGPT
    connect: Connect ChatGPT
    connectionDisclosure: Reads usage from your signed-in browser session, stores normalized usage locally, and refreshes about every 15 minutes.
    capabilities:
      messageLimits: Message limits
      credits: Credits
    plans:
      plus: Plus
  claude:
    name: Claude
    connect: Connect Claude
    connectionDisclosure: Reads usage from your signed-in browser session, stores normalized usage locally, and refreshes about every 15 minutes.
    capabilities:
      messageLimits: Message limits
      extraUsage: Extra usage
  kimi:
    name: Kimi
    connect: Connect Kimi
    connectionDisclosure: With permission, AI Limits may read the exact value of Kimi's signed-in kimi-auth cookie or the page's localStorage.access_token on kimi.com. It stores normalized usage locally, not the credential.
    manualRefreshDisclosure: Connect and manual Refresh may briefly open one inactive Kimi tab when recovery is needed. Scheduled or automatic refresh never opens a tab.
    capabilities:
      subscriptionUsage: Subscription usage
      codingLimits: Coding limits
  cursor:
    name: Cursor
    connect: Connect Cursor
    connectionDisclosure: Reads base usage from your signed-in Cursor session and refreshes it about every 15 minutes. On Connect or manual Refresh, AI Limits may run bundled read-only code in one already-open cursor.com page to request Grok Bot and extra-credit JSON. It does not inspect page content, browser storage, or cookie values directly; Chrome attaches signed-in Cursor cookies to those fixed same-origin requests.
    manualRefreshDisclosure: Cursor page enrichment uses only an already-open Cursor tab. It never creates or activates a tab, and scheduled or automatic refresh never injects into a page.
    capabilities:
      monthlyUsage: Monthly usage
      grokBotUsage: Grok Bot usage
      onDemandSpend: On-demand spend
      extraUsageCredits: Extra usage credits
    plans:
      ultra: Ultra
  grok:
    name: Grok
    connect: Connect Grok
    connectionDisclosure: Reads usage from your signed-in browser session, stores normalized usage locally, and refreshes about every 15 minutes.
    capabilities:
      usagePool: Usage pool
      planTier: Plan tier
    plans:
      free: Free
      superGrok: SuperGrok
      heavy: SuperGrok Heavy
      plus: SuperGrok Plus
      lite: SuperGrok Lite
  elevenlabs:
    name: ElevenLabs
    connect: Connect ElevenLabs
    connectionDisclosure: Uses an API key you provide, stores it locally in AI Limits, and refreshes about every 15 minutes.
    capabilities:
      monthlyCredits: Monthly credits
      voiceLimits: Voice limits
    plans:
      free: Free
  newapi:
    name: New API
    connect: Connect New API
    connectionDisclosure: Supports multiple independent connections. Each stores its own New API instance URL, relay key, label, usage, and History locally; same-origin connections share only Chrome's host permission.
    capabilities:
      apiKeyQuota: API key quota
      unlimitedKeyUsage: Unlimited-key usage

