[extend]
useDefault = true

[[allowlists]]
description = "Canonical New API instance IDs in storage contract tests"
condition = "AND"
regexTarget = "match"
paths = [
  '''^storage/(?:credential-vault|credentials|instance-repository|repository|state-codec)\.test\.ts$''',
]
regexes = [
  '''\bnewapi:[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b''',
]
